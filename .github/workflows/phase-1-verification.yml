name: MasterChef Phase 1 Verification

on:
  push:
    branches: [main, phase-1-identity-security]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: Build all frontends
        run: pnpm -r build

      - name: Test native security core
        run: cargo test --manifest-path packages/native-core/Cargo.toml --all-targets

      - name: Check CEO native application
        run: cargo check --manifest-path apps/ceo/src-tauri/Cargo.toml

      - name: Check Restaurant native application
        run: cargo check --manifest-path apps/restaurant/src-tauri/Cargo.toml
